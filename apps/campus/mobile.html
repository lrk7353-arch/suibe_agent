<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小贸 · 手机端交互样例</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eff6;color:#18354e;font:16px/1.7 "Microsoft YaHei",sans-serif;padding:32px}main{max-width:1160px;margin:auto}h1{font-size:32px}p{color:#577086}.screens{display:flex;gap:36px;flex-wrap:wrap;margin-top:28px}.device{background:white;border:8px solid #18354e;border-radius:38px;overflow:hidden;box-shadow:0 18px 45px #18354e18;width:391px;height:820px}.device iframe{width:375px;height:804px;border:0}.notes{max-width:300px}a{color:#0066b3}button{border:1px solid #9bb8ce;background:white;border-radius:10px;padding:12px 18px;font:inherit;color:#0066b3;cursor:pointer}button:focus-visible{outline:3px solid #ce8800}@media(max-width:460px){body{padding:20px 8px}.device{border:0;border-radius:16px;width:100%;height:800px}.device iframe{width:100%;height:100%}h1{font-size:24px}}</style></head><body><main><a href="/">返回网页版</a><h1>把小贸，装进口袋。</h1><p>可操作的移动网页样例。与桌面端共用资料与问答服务。</p><div class="screens"><div class="device"><iframe id="phone" src="/#home" title="375 像素宽手机端交互样例"></iframe></div><div class="notes"><h2>从拇指开始设计</h2><p>四个底部入口，常用操作保持 48 像素触控高度。聊天、追问、原文和收藏都可以在这个样例里实际操作。</p><button data-page="home">看首页</button> <button data-page="chat">看聊天</button><p>问答页面保留原始来源。空收藏、无搜索结果与连接失败均有明确提示。</p><h2>未来 Android 版本</h2><p>原生端还需要处理软键盘、系统返回、文件下载与模型管理。本页是交互和视觉样例，尚未打包为 APK。</p><h2>轻一点</h2><p>本版前端使用本地 CSS、脚本和系统字体，加载时无需访问字体或图标 CDN。</p></div></div></main><script>document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>document.getElementById('phone').contentWindow.location.hash=b.dataset.page)</script></body></html>
