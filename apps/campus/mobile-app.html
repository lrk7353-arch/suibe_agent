<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小贸随身版</title>
<style>:root{font-family:system-ui,sans-serif;color:#193247;background:#f3f7fb}*{box-sizing:border-box}body{margin:0;padding:24px 20px 48px;max-width:760px;margin-inline:auto}header{border-bottom:3px solid #0066b3;padding:20px 0}h1{font-size:32px;margin:8px 0}p{line-height:1.8}small{color:#4b6172}nav{display:flex;gap:12px;margin:24px 0}button,input{font:inherit;min-height:44px;border-radius:8px;border:1px solid #b9cad8;padding:10px;max-width:100%}button{background:#0066b3;color:white;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #e69b26;outline-offset:3px}article,form{background:white;border:1px solid #d8e3ed;padding:20px;margin:16px 0;border-radius:12px}label{display:block;margin:12px 0}input{display:block;width:100%;margin-top:6px}pre{white-space:pre-wrap;font:inherit;line-height:1.8;overflow-wrap:anywhere}a{color:#0066b3}summary{cursor:pointer;min-height:44px;line-height:1.6}output{display:block;white-space:pre-wrap;line-height:1.8;margin-top:16px}[hidden]{display:none!important}.notice{border-left:3px solid #0066b3;padding-left:12px}</style>
<header><small>SUIBE · 学生创作项目</small><h1>小贸，随身带着。</h1><p>查一份校园指南，算一道经贸题。<br>这两个小工具，离线也能用。</p></header>
<nav aria-label="页面"><button id="guides-tab">校园指南</button><button id="tools-tab">经贸计算器</button></nav>
<section id="guides"><label for="filter">查找指南<input id="filter" type="search" placeholder="借阅、校园网、成绩"></label><p class="notice">内置 3 份来源明确的指南。办理前请核对原文日期和当期通知。</p><div id="cards" aria-live="polite">正在读取离线资料…</div></section>
<section id="tools" hidden><h2>进口成本试算</h2><p>从货价到人民币含税成本，把计算过程看清楚。</p><form id="cost-form"><label>货价（外币）<input name="price" type="number" min="0" step="any" required></label><label>运费（同一外币）<input name="freight" type="number" min="0" step="any" value="0" required></label><label>保险费（同一外币）<input name="insurance" type="number" min="0" step="any" value="0" required></label><label>汇率（人民币 / 外币）<input name="fx" type="number" min="0.000001" step="any" required></label><label>关税率（%）<input name="duty" type="number" min="0" max="100" step="any" required></label><label>增值税率（%）<input name="vat" type="number" min="0" max="100" step="any" required></label><button>计算并查看过程</button><output id="result" aria-live="polite"></output></form><p>汇率与税率由你填写；这是课堂计算模型。</p></section>
<footer><small>轻量离线版 0.1 · 不含模型权重 · 查看原文会打开浏览器</small></footer>
<script src="trade-tools.js"></script><script>
const $=id=>document.getElementById(id);let cards=[];
function show(tab){$('guides').hidden=tab!=='guides';$('tools').hidden=tab!=='tools';$('guides-tab').setAttribute('aria-pressed',tab==='guides');$('tools-tab').setAttribute('aria-pressed',tab==='tools');}
$('guides-tab').onclick=()=>show(location.hash==='#tools'?'tools':'guides');$('tools-tab').onclick=()=>show('tools');show('guides');
function render(){const q=$('filter').value.trim();$('cards').replaceChildren();for(const c of cards.filter(c=>(c.title+c.text).includes(q))){const a=document.createElement('article'),d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre'),link=document.createElement('a');s.textContent=c.title+' · '+c.date;p.textContent=c.text;link.textContent='查看来源原文';link.href=c.url;d.append(s,p,link);a.append(d);$('cards').append(a);}if(!$('cards').children.length)$('cards').textContent='没有匹配的指南，试试其他关键词。';}
fetch('offline-cards.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{cards=d;render()}).catch(()=>$('cards').textContent='资料读取失败，请重新打开。');$('filter').oninput=render;
$('cost-form').onsubmit=e=>{e.preventDefault();try{const a=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));const r=TradeTools.execute('landed_cost',a).result;$('result').textContent=`完税价格 =（货价 + 运费 + 保险费）× 汇率 = ¥${r.customs}\n关税 = 完税价格 × 关税率 = ¥${r.duty}\n增值税 =（完税价格 + 关税）× 增值税率 = ¥${r.vat}\n合计：¥${r.total}\n\n${r.note}`;}catch(error){$('result').textContent=error.message;}};
</script></html>
