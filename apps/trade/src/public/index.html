<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0066b3">
<title>小贸 · 进口成本案例演示</title>
<link rel="stylesheet" href="/demo.css">
</head>
<body>
<a class="skip" href="#chat">跳到对话</a>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">贸</span>
    <div class="brand-text">
      <strong>小贸</strong>
      <small>经贸案例演示 · 上海对外经贸大学</small>
    </div>
  </div>
  <div class="topbar-meta">
    <span class="pill teaching">教学案例 · 固定数据</span>
    <span class="pill" id="conn">连接中</span>
    <button type="button" class="quiet" id="reset">重新开始</button>
  </div>
</header>

<div class="mobile-tabs" role="tablist" aria-label="移动端视图切换">
  <button type="button" role="tab" id="tabChat" aria-selected="true" aria-controls="chat">对话</button>
  <button type="button" role="tab" id="tabCards" aria-selected="false" aria-controls="workbench">条件与结果<span class="dot" id="tabDot" hidden></span></button>
</div>

<main class="layout">
  <section class="chat" id="chat" aria-label="对话区">
    <div class="chat-head">
      <div class="pet" id="pet" aria-hidden="true">
        <svg viewBox="0 0 64 64" focusable="false">
          <ellipse cx="29" cy="39" rx="17" ry="13" fill="#fff" stroke="#0066b3" stroke-width="2.2"/>
          <path d="M23 42c-7-3-12 0-14 6 6 2 11 1 14-2" fill="#e7f2fa" stroke="#0066b3" stroke-width="2"/>
          <circle cx="44" cy="26" r="9.5" fill="#fff" stroke="#0066b3" stroke-width="2.2"/>
          <circle cx="47" cy="24" r="1.7" fill="#123d65"/>
          <path d="M53 27l8 2.5-8 3z" fill="#ce8800"/>
          <path d="M35 34c4 3 9 1 11-2" fill="none" stroke="#0066b3" stroke-width="2" stroke-linecap="round"/>
          <path d="M34 37c-1 5 0 9 4 11" fill="none" stroke="#0066b3" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="18" y="45" width="14" height="10" rx="2" fill="#e7f2fa" stroke="#123d65" stroke-width="1.6"/>
          <path d="M21 48h8M21 51h6" stroke="#123d65" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="chat-title">
        <h1>一笔进口订单的成本决策</h1>
        <p>补齐条件 → 确定性计算 → 改条件重算 → 比较报价 → 导出摘要</p>
      </div>
      <span class="pet-status" id="petStatus" role="status" aria-live="polite">等你开口</span>
    </div>

    <div class="chat-log" id="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="chips" id="chips" aria-label="快捷输入"></div>

    <form class="composer" id="composer">
      <label class="sr-only" for="q">输入问题</label>
      <textarea id="q" rows="1" maxlength="500" placeholder="例如：帮我算一下这批进口商品的成本"></textarea>
      <button type="submit" class="primary" id="send">发送</button>
      <div class="composer-foot">
        <span id="count">0 / 500</span>
        <span>金额由本地确定性程序计算，模型只负责理解与解释</span>
      </div>
    </form>
  </section>

  <section class="workbench" id="workbench" aria-label="案例工作台">
    <div class="workbench-head">
      <div class="segmented" role="group" aria-label="阅读层次">
        <button type="button" id="levelQuick" class="active" aria-pressed="true">快速看结果</button>
        <button type="button" id="levelLearn" aria-pressed="false">展开学习过程</button>
      </div>
      <span class="state-version" id="stateVersion">状态 v1</span>
    </div>
    <div id="cards" class="cards"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="preview" aria-labelledby="previewTitle">
  <div class="dialog-head">
    <h2 id="previewTitle">摘要预览</h2>
    <button type="button" class="quiet" id="previewClose">关闭</button>
  </div>
  <div id="previewBody"></div>
</dialog>

<script src="/demo.js"></script>
</body>
</html>
